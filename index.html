<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#efeeea">
<meta name="description" content="AURA BOARD — ຈັດການອໍເດີ ແລະ ຄິດໄລ່ກຳໄລຮ້ານແປ້ນພິມ">
<title>AURA BOARD — ກຳໄລ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Noto+Sans+Lao:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/jpeg" href="assets/logo.jpg">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">

  <header>
    <div class="brand-row">
      <div class="logo-badge">
        <img src="assets/logo.jpg" alt="Aura Board">
      </div>
      <div class="brand-text">
        <div class="eyebrow">AURA BOARD</div>
        <h1 class="display">ກຳໄລຮ້ານ</h1>
        <div class="sub">ຈັດການອໍເດີ ແລະ ຄິດໄລ່ກຳໄລ</div>
      </div>
    </div>
    <svg class="squiggle" viewBox="0 0 150 10" preserveAspectRatio="none">
      <path d="M1 5 Q 15 1, 30 5 T 60 5 T 90 5 T 120 5 T 149 5" stroke="#33323b" stroke-width="2" fill="none" stroke-linecap="round"/>
    </svg>
  </header>

  <div class="view active" id="view-add">
    <div class="card">
      <div class="card-label"><span class="pin"></span>ອໍເດີໃໝ່</div>

      <label for="orderDate">ວັນທີ</label>
      <div class="date-field">
        <input type="date" id="orderDate" class="date-native-input">
        <div class="date-display-text" id="dateDisplayText">—</div>
      </div>

      <label for="itemName">ຮຸ່ນ / ສິນຄ້າ</label>
      <input type="text" id="itemName" placeholder="ຕົວຢ່າງ: Keychron K8 Pro">

      <div class="row2">
        <div>
          <label for="priceInput">ລາຄາຂາຍ (ກີບ)</label>
          <input type="number" id="priceInput" inputmode="decimal" placeholder="0">
        </div>
        <div>
          <label for="costInput">ຕົ້ນທຶນ (ກີບ)</label>
          <input type="number" id="costInput" inputmode="decimal" placeholder="0">
        </div>
      </div>

      <label for="shipInput">ຄ່າສົ່ງ (ກີບ)</label>
      <input type="number" id="shipInput" inputmode="decimal" placeholder="0">

      <div class="receipt">
        <span class="lbl">ກຳໄລອໍເດີນີ້</span>
        <span id="previewProfit" class="val display pos">0 ກີບ</span>
      </div>

      <button class="btn-primary" id="saveBtn">ບັນທຶກອໍເດີ</button>
    </div>
  </div>

  <div class="view" id="view-overview">
    <div class="card">
      <div class="card-label"><span class="pin"></span>ພາບລວມລາຍເດືອນ</div>
      <div class="chip-row" id="monthChips"></div>
      <div class="stat-grid">
        <div class="stat">
          <div class="label">ຍອດຂາຍ</div>
          <div class="value display" id="statRevenue">0</div>
        </div>
        <div class="stat">
          <div class="label">ຕົ້ນທຶນ+ສົ່ງ</div>
          <div class="value display" id="statCost">0</div>
        </div>
        <div class="stat">
          <div class="label" style="color:var(--green)">ກຳໄລສຸດທິ</div>
          <div class="value display" id="statProfit" style="color:var(--green)">0</div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-label"><span class="pin"></span>ລາຍການອໍເດີ</div>
      <div id="orderList"><div class="empty">ກຳລັງໂຫຼດຂໍ້ມູນ...</div></div>
    </div>
  </div>

</div>

<div class="toast" id="toast">ບັນທຶກແລ້ວ</div>

<div class="tabbar">
  <div class="tabbar-inner">
    <button class="tab-btn active" data-view="view-add">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg>
      ບັນທຶກ
    </button>
    <button class="tab-btn" data-view="view-overview">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19V10M11 19V5M18 19v-6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      ພາບລວມ
    </button>
  </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
